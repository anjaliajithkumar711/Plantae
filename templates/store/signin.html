
{% extends 'store/base.html' %}

{% block title %}Sign In | PLANTAE{% endblock %}

{% block content %}

<section class="signin-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <div class="signin-card">

                    <div class="text-center mb-4">

                        <h1>Welcome Back</h1>

                        <p class="text-muted">
                            Sign in to your PLANTAE account
                        </p>

                    </div>

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input type="text"
                                   name="username"
                                   class="form-control"
                                   placeholder="Enter your username"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="Enter your password"
                                   required>

                        </div>

                        <button type="submit"
                                class="btn btn-success w-100 mt-3">
                            Sign In
                        </button>

                    </form>

                    <div class="text-center mt-4">

                        <p class="text-muted">
                            New to PLANTAE?
                        </p>

                        <a href="{% url 'signup' %}"
                           class="btn btn-outline-success w-100">
                            Create an account
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
