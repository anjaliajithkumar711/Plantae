
{% extends 'store/base.html' %}

{% block title %}Contact Us | PLANTAE{% endblock %}

{% block content %}

<section class="container py-5">

    <div class="section-heading text-center mb-5">
        <h1>Contact Us</h1>
        <p>We would love to hear from you</p>
    </div>

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="contact-card">

                <h3>Get in Touch</h3>

                <p class="text-muted">
                    Have questions about our plants?
                    Send us a message.
                </p>

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">
                            Your Name
                        </label>

                        <input type="text"
                               name="name"
                               class="form-control"
                               placeholder="Enter your name"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Email Address
                        </label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               placeholder="Enter your email"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Message
                        </label>

                        <textarea name="message"
                                  class="form-control"
                                  rows="5"
                                  placeholder="Write your message"
                                  required></textarea>
                    </div>

                    <button type="submit"
                            class="btn btn-success w-100">
                        Send Message
                    </button>

                </form>

            </div>

        </div>

    </div>

</section>

{% endblock %}
